services:
  postgres:
    image: postgres:16-alpine
    container_name: hubsell-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hubsell
      POSTGRES_PASSWORD: hubsell_dev_password
      POSTGRES_DB: hubsell
    ports:
      - "5432:5432"
    volumes:
      - hubsell_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubsell -d hubsell"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hubsell_pgdata:
