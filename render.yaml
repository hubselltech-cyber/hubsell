# ============================================================
# RENDER BLUEPRINT — deploy backend Hubsell lên Render Free.
#
# Cách dùng: Render Dashboard → New → Blueprint → chọn repo này. Render đọc
# file này và dựng đúng service; các env đánh dấu sync:false sẽ được hỏi khi
# tạo (điền tay — KHÔNG commit giá trị thật vào đây).
#
# Database KHÔNG tạo ở đây — dùng Supabase (free), điền chuỗi kết nối
# Session pooler + sslmode=require vào DATABASE_URL. Chi tiết từng bước:
# docs/DEPLOY-RENDER-SUPABASE.md
# ============================================================
# LƯU Ý 31/07: service production THẬT là hubsell-backend-sg (Singapore, tạo
# tay trên Dashboard, auto-deploy từ master). Blueprint instance cũ đã
# DISCONNECT + service Oregon hubsell-backend đã XÓA — file này chỉ còn là
# khuôn dựng lại hạ tầng khi cần (đúng tên + region Singapore bên dưới).
services:
  # ---- (12/09) WORKER NỀN RIÊNG — Background Worker, KHÔNG mở cổng HTTP ----
  # Cùng repo/cùng build với web; chỉ khác HUBSELL_ROLE=worker. Env sàn/MISA/
  # DB phải KHAI Y HỆT service web (worker gọi API sàn + ghi DB). Cách lên:
  #   1) Dashboard → New → Background Worker → repo này, rootDir backend,
  #      copy toàn bộ env từ hubsell-backend-sg rồi thêm HUBSELL_ROLE=worker.
  #   2) Khi worker chạy ổn (log [Role] worker + [Auto-sync] BẬT) → đặt
  #      HUBSELL_ROLE=web trên service web để web ngừng chạy worker trùng.
  # Chưa có service này thì web chạy vai all như cũ — không đổi hành vi.
  - type: worker
    name: hubsell-worker-sg
    runtime: node
    plan: starter # Background Worker không có gói free; đợi anh Trung nâng gói sau ISV
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # migrate deploy idempotent (Prisma tự khóa) — worker lên trước web vẫn khớp schema.
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: HUBSELL_ROLE
        value: worker
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # ...và toàn bộ env sàn/MISA/APP_FRONTEND_URL giống service web (sync: false).

  - type: web
    name: hubsell-backend-sg
    runtime: node
    plan: starter # 512 MB — cờ heap trong `npm start` (backend/package.json) tính theo gói này; nâng gói thì sửa cờ (docs/DEPLOY-RENDER-SUPABASE.md bước 2c)
    region: singapore
    rootDir: backend
    # prisma generate chạy trong build (Render cache node_modules — client phải
    # sinh lại theo schema mới); migrate deploy chạy lúc start để bảng trên
    # Supabase luôn khớp code đang chạy.
    # --include=dev bắt buộc: NODE_ENV=production làm npm ci bỏ devDependencies,
    # mà typescript/@types/prisma CLI đều nằm ở đó — thiếu là tsc fail.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # chuỗi Supabase Session pooler, kèm ?sslmode=require
        # Nên thêm &connection_limit=5&pool_timeout=30 — Supabase Free giới hạn
        # ~15 kết nối, để Prisma tự mở theo CPU dễ nghẽn pool giờ cao điểm.
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render tự sinh chuỗi ngẫu nhiên bí mật
      # MISA_API_BASE: KHÔNG khai — code mặc định đúng cổng developer.misa.vn. (Dòng
      # cũ trỏ testapi.meinvoice.vn là host CHẾT, đã gỡ tay trên Render 24/08; gỡ
      # nốt ở đây 19/09 để đồng bộ blueprint không cài lại.)
      # ---- Mã hóa bí mật NCC hóa đơn trong DB (backend/src/lib/secret-box.ts) ----
      # Dạng "k1:<base64 32 byte>"; cách tạo + CẤT DỰ PHÒNG + xoay khóa:
      # docs/BAO-MAT-MA-HOA-BI-MAT.md. MẤT KHÓA = khách phải nhập lại mật khẩu.
      - key: SECRET_ENC_KEYS
        sync: false
      - key: MISA_CLIENT_ID
        sync: false
      - key: MISA_CLIENT_SECRET
        sync: false
      - key: MISA_WEBHOOK_SECRET # BẮT BUỘC trên production — thiếu là webhook trả 503
        sync: false
      - key: APP_FRONTEND_URL
        sync: false # URL frontend (local hoặc deploy sau) để các luồng OAuth redirect về
      # ---- Shopee Open Platform (production) ----
      # Redirect OAuth + URL webhook KHÔNG cần khai: code tự suy từ
      # RENDER_EXTERNAL_URL (Render tự bơm) →
      #   callback: https://<app>.onrender.com/api/auth/shopee/callback
      #   webhook : https://<app>.onrender.com/api/webhook/shopee
      # Đăng ký đúng 2 URL đó trên Shopee Console (webhook phải trùng từng ký tự).
      - key: SHOPEE_PARTNER_ID
        sync: false
      - key: SHOPEE_PARTNER_KEY
        sync: false
      - key: SHOPEE_PUSH_PARTNER_KEY # key ký push RIÊNG — Console → Set Push
        sync: false
      - key: SHOPEE_ENV
        value: production
      - key: HUBSELL_ROLE # all (mặc định) | web (khi đã có hubsell-worker-sg) | worker
        value: all
      - key: AUTO_SYNC_MINUTES # tự quét đơn Shopee+Lazada mỗi N phút, đối soát Lazada mỗi 6N phút ("0" = tắt)
        value: "10"
      # ---- Lazada Open Platform (đã cấu hình tay trên Dashboard từ 28/07 —
      # khai ở đây để Blueprint tái tạo được service đầy đủ) ----
      - key: LAZADA_APP_KEY
        sync: false
      - key: LAZADA_APP_SECRET
        sync: false
      - key: LAZADA_REDIRECT_URI # https://<app>.onrender.com/api/auth/lazada/callback
        sync: false
