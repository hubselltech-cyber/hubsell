<!doctype html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>M0 — đo nhiều bàn trên một máy</title>
	<style>
		:root { color-scheme: light dark; --bg: #f6f7f9; --fg: #111827; --muted: #6b7280; --card: #ffffff; --line: #e5e7eb; --ok: #047857; --bad: #b91c1c; }
		@media (prefers-color-scheme: dark) { :root { --bg: #0b0f14; --fg: #e5e7eb; --muted: #9ca3af; --card: #111827; --line: #1f2937; --ok: #34d399; --bad: #f87171; } }
		body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
		h1 { font-size: 18px; margin: 0 0 4px; }
		.sub { color: var(--muted); margin: 0 0 12px; }
		.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 12px; }
		label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
		select, input, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
		button { cursor: pointer; font-weight: 600; }
		.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
		.cell { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
		.cell video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 4px; }
		.cell h2 { font-size: 14px; margin: 0 0 6px; }
		.cell pre { font: 12px/1.4 Consolas, monospace; margin: 6px 0 0; white-space: pre-wrap; }
		.state { font-weight: 700; }
		.state.bad { color: var(--bad); }
		.state.ok { color: var(--ok); }
		#global, #log { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 12px/1.4 Consolas, monospace; white-space: pre-wrap; margin-top: 12px; max-height: 320px; overflow: auto; }
	</style>
</head>
<body>
	<h1>M0 — đo nhiều bàn trên một máy</h1>
	<p class="sub">Trang thử nội bộ, không phải mã sản phẩm (bản thiết kế mục 18). Mỗi camera = một bàn: in ngày giờ + mã hóa H.264 + đọc tem + ghi tệp thẳng xuống ổ đĩa của trình duyệt (OPFS).</p>
	<div class="bar">
		<button id="btn-open">Mở mọi camera</button>
		<label>Bộ mã hóa<select id="sel-hw"><option value="prefer-hardware" selected>ưu tiên phần cứng</option><option value="prefer-software">ép phần mềm (CPU)</option><option value="no-preference">để Chrome chọn</option></select></label>
		<label>Giây mỗi clip<input id="inp-clip" type="number" min="5" max="1800" value="60"></label>
		<label>Phút đo<input id="inp-minutes" type="number" min="1" max="240" value="30"></label>
		<button id="btn-start">Bắt đầu đo</button>
		<button id="btn-stop">Dừng</button>
	</div>
	<div class="grid" id="grid"></div>
	<div id="global"></div>
	<div id="log"></div>
	<script type="module" src="./nhieu-ban.js"></script>
</body>
</html>
